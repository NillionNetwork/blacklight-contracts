# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200

# Allow writing contract addresses to project root
fs_permissions = [{ access = "read-write", path = "./" }]

remappings = [
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]

# Invariant test config for the default (CI/PR) profile.
# Keep runs/depth modest so PR runs stay fast, but enforce fail_on_revert
# so unexpected reverts in handlers surface as failures instead of silent
# discards. Handlers are responsible for guarding preconditions; if a call
# reverts, that is a real bug or a missing guard that needs investigation.
[profile.default.invariant]
runs = 256
depth = 500
fail_on_revert = true

# Nightly profile: same source/build settings as default, but invariant tests
# explore a much larger search space. Run with: FOUNDRY_PROFILE=nightly forge test
[profile.nightly.invariant]
runs = 2500
depth = 1500
fail_on_revert = true
