name: script-quality

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  shell-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt

      - name: Shell syntax checks
        run: |
          bash -n script/deployment/deploy.sh \
            script/deployment/shlib/common.sh \
            script/deployment/deploy_testnet_with_verify.sh \
            script/deployment/deploy_mainnet_with_verify.sh \
            docker/start-anvil.sh

      - name: Shell lint
        run: |
          shellcheck script/deployment/*.sh script/deployment/shlib/*.sh docker/start-anvil.sh

      - name: Shell format check
        run: |
          shfmt -d script/deployment/*.sh script/deployment/shlib/*.sh docker/start-anvil.sh

      - name: Deploy script smoke checks
        run: |
          ./script/deployment/deploy.sh --help
          ./script/deployment/deploy_testnet_with_verify.sh --help
          ./script/deployment/deploy_mainnet_with_verify.sh --help
